[project]
name = "enigmatech-inspection-bot"
version = "0.1.0"
description = "Telegram bot for construction site inspection reports"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "python-docx>=1.1.0",
    "python-telegram-bot>=20.0",
]

[project.scripts]
enigmatech-inspection-bot = "enigmatech_inspection_bot.bot:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
